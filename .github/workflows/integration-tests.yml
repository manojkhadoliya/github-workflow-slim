name: Integration tests

# Negative slimify example: needs a `services:` container. ubuntu-slim jobs
# run unprivileged inside their own container and cannot start sibling
# service containers, so this job must stay on ubuntu-latest.

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
