name: Dependency review

# Fails a PR that introduces a dependency with a known vulnerability or an
# incompatible license. Runs entirely against the PR's dependency graph via
# the GitHub API - no install/build needed.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Scan dependency changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: always
