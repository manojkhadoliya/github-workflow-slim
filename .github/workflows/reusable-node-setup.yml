name: Reusable — Node setup + browsers

# Callable building block: checkout, Node, install deps, install Playwright
# browsers. Has no caller of its own - `runs-on` here only matters for
# whichever workflow calls it via `uses:`.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"

jobs:
  setup:
    name: Prepare environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
